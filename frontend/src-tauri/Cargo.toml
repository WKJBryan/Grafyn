[package]
name = "grafyn"
version = "0.3.0"
description = "Grafyn - Knowledge Management Desktop App"
authors = ["Bryan"]
license = "MPL-2.0"
repository = "https://github.com/WKJBryan/Grafyn"
edition = "2021"

[lib]
name = "grafyn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Two binaries: Tauri desktop app and standalone MCP server
[[bin]]
name = "grafyn"
path = "src/main.rs"
required-features = ["tauri-app"]

[[bin]]
name = "grafyn-mcp"
path = "src/mcp.rs"
required-features = ["mcp"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [], optional = true }

[dependencies]
# Tauri core (optional — only needed for the desktop app binary)
tauri = { version = "=2.11.5", optional = true, features = [] }
tauri-plugin-dialog = { version = "=2.7.2", optional = true }
tauri-plugin-opener = { version = "=2.5.4", optional = true }
tauri-plugin-os = { version = "=2.3.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
fs2 = "0.4"

# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "macros", "fs", "io-util", "time"] }

# File handling
gray_matter = "0.2"
walkdir = "2.4"
notify = "6.1"
serde_yaml = "0.9"
zip = "0.6"
quick-xml = "0.39"
pdf-extract = "0.7"
lopdf = "0.34"

# Search
tantivy = "0.22"

# Graph data structure
petgraph = "0.6"

# Regex for wikilink parsing
regex = "1.10"
lazy_static = "1.4"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"

# HTTP client for OpenRouter
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"

# Logging
log = "0.4"
env_logger = "0.11"

# System paths
dirs = "5.0"
keyring = "2.3"

# MCP server (optional — only needed for the grafyn-mcp binary)
rmcp = { version = "0.15", features = ["server", "transport-io"], optional = true }
schemars = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = { version = "=2.3.1", optional = true }
tauri-plugin-updater = { version = "=2.10.1", optional = true }

[features]
default = ["tauri-app", "desktop-process", "desktop-updater", "custom-protocol"]
tauri-app = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-os"
]
desktop-process = ["tauri-app", "dep:tauri-plugin-process"]
desktop-updater = ["tauri-app", "dep:tauri-plugin-updater"]
custom-protocol = ["tauri-app", "tauri/custom-protocol"]
mcp = ["dep:rmcp", "dep:schemars", "dep:clap"]
twin-eval-lab = ["tauri-app"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
