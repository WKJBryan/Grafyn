[package]
name = "grafyn"
version = "0.4.0"
description = "Grafyn - Knowledge Management Desktop App"
authors = ["Bryan"]
license = "MPL-2.0"
repository = "https://github.com/WKJBryan/Grafyn"
edition = "2021"

[workspace]
members = [".", "crates/grafyn-sync-protocol"]
resolver = "2"

[lib]
name = "grafyn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Binary targets: desktop app, MCP server, and feature-gated system-test runtime
[[bin]]
name = "grafyn"
path = "src/main.rs"
required-features = ["tauri-app"]

[[bin]]
name = "grafyn-mcp"
path = "src/mcp.rs"
required-features = ["mcp"]

[[bin]]
name = "grafyn-evidence-maintenance"
path = "src/evidence_maintenance.rs"
required-features = ["mcp"]

[[bin]]
name = "grafyn-test-runtime"
path = "src/bin/grafyn-test-runtime.rs"
required-features = ["e2e-test-runtime"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [], optional = true }

[dependencies]
# Tauri core (optional — only needed for the desktop app binary)
tauri = { version = "=2.11.5", optional = true, features = [] }
tauri-plugin-opener = { version = "=2.5.4", optional = true }
tauri-plugin-os = { version = "=2.3.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }
grafyn-sync-protocol = { version = "0.1.0", path = "crates/grafyn-sync-protocol" }
fs2 = "0.4"
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
tempfile = "3"

# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "macros", "fs", "io-util", "time"] }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }

# File handling
gray_matter = "0.2"
walkdir = "2.4"
serde_yaml = "0.9"

# Search
tantivy = "0.22"

# Graph data structure
petgraph = "0.6"

# Regex for wikilink parsing
regex = "1.10"
lazy_static = "1.4"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"

# HTTP client for OpenRouter
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"

# Logging
log = "0.4"
env_logger = "0.11"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = { version = "=2.7.2", optional = true }
tauri-plugin-process = { version = "=2.3.1", optional = true }
tauri-plugin-updater = { version = "=2.10.1", optional = true }
dirs = "5.0"
keyring = "2.3"
zip = "0.6"
quick-xml = "0.41"
pdf-extract = "0.12"
lopdf = "0.42"

# MCP server (optional — only needed for the non-mobile grafyn-mcp binary)
rmcp = { version = "1.4", features = ["server", "transport-io"], optional = true }
schemars = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[features]
default = ["tauri-app", "desktop-process", "desktop-updater", "custom-protocol"]
tauri-app = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-os"
]
desktop-process = ["tauri-app", "dep:tauri-plugin-process"]
desktop-updater = ["tauri-app", "dep:tauri-plugin-updater"]
custom-protocol = ["tauri-app", "tauri/custom-protocol"]
mcp = ["dep:rmcp", "dep:schemars", "dep:clap"]
e2e-test-runtime = [
    "tauri-app",
    "tauri/test",
    "tokio/net",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
