name: Test Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_CACHE_VERSION: v1

jobs:
  # ============================================================================
  # Tier 1: On every push (fast, <5min)
  # ============================================================================

  release-preflight:
    name: Release Preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@1.93.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          key: ${{ runner.os }}-release-preflight-1.93.1-${{ hashFiles('frontend/src-tauri/Cargo.lock', '.github/workflows/test.yml') }}-${{ env.RUST_CACHE_VERSION }}

      - name: Validate release manifests and lockfile
        run: cd frontend && npm run release:verify

      - name: Validate license alignment
        run: cd frontend && npm run check:licenses

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.93.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          key: ${{ runner.os }}-ubuntu2204-1.93.1-${{ hashFiles('frontend/src-tauri/Cargo.lock', '.github/workflows/test.yml') }}-${{ env.RUST_CACHE_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Prepare build artifacts for Tauri
        run: |
          # Tauri's generate_context!() requires frontendDist to exist at compile time.
          mkdir -p frontend/dist && echo '<html></html>' > frontend/dist/index.html
          cd frontend
          # Exercise the desktop MCP sidecar preparation path used by bundles.
          node scripts/prepare-sidecar.cjs

      - name: Run Rust tests
        run: cd frontend/src-tauri && cargo test --locked

      - name: Run sync protocol tests
        run: cd frontend/src-tauri && cargo test --locked --package grafyn-sync-protocol

      - name: Run MCP feature tests
        run: cd frontend/src-tauri && cargo test --locked --no-default-features --features mcp

      - name: Run E2E runtime contract tests
        run: cd frontend/src-tauri && cargo test --locked --lib --features e2e-test-runtime test_runtime::tests -- --test-threads=1

      - name: Build E2E runtime binary
        run: cd frontend/src-tauri && cargo build --locked --features e2e-test-runtime --bin grafyn-test-runtime

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

  system-e2e:
    name: Desktop and Companion System E2E
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - uses: dtolnay/rust-toolchain@1.93.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          key: ${{ runner.os }}-system-e2e-1.93.1-${{ hashFiles('frontend/src-tauri/Cargo.lock', 'e2e/package-lock.json', '.github/workflows/test.yml') }}-${{ env.RUST_CACHE_VERSION }}

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install application and E2E dependencies
        run: |
          cd frontend
          npm ci
          npm run prepare:sidecar
          npm run build
          cd ../e2e
          npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Verify strict local fixtures
        working-directory: e2e
        run: npm run test:fixtures

      - name: Run real-system Playwright journeys
        working-directory: e2e
        run: npm test

  # linux-desktop-build removed — release-smoke.yml covers Linux builds on every PR/push

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          key: ${{ runner.os }}-ubuntu2204-clippy-1.93.1-${{ hashFiles('frontend/src-tauri/Cargo.lock', '.github/workflows/test.yml') }}-${{ env.RUST_CACHE_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend linting
        run: cd frontend && npm run lint

      - name: Check source file sizes
        run: cd frontend && npm run check:file-sizes

      - name: Check Rust formatting
        run: cd frontend/src-tauri && cargo fmt --all -- --check

      - name: Run Rust clippy for the desktop product
        run: cd frontend/src-tauri && cargo clippy --locked --lib --bin grafyn -- -D warnings
        continue-on-error: true  # TODO: remove after the supported-profile lint debt is resolved

      - name: Run Rust clippy for the MCP binary
        run: cd frontend/src-tauri && cargo clippy --locked --no-default-features --features mcp --bin grafyn-mcp -- -D warnings
        continue-on-error: true  # TODO: remove after the supported-profile lint debt is resolved

      - name: Run Rust clippy for the E2E runtime
        run: cd frontend/src-tauri && cargo clippy --locked --features e2e-test-runtime --bin grafyn-test-runtime -- -D warnings
        continue-on-error: true  # TODO: remove after the supported-profile lint debt is resolved

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run RustSec advisory audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: frontend/src-tauri

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run frontend npm audit
        run: cd frontend && npm audit --audit-level=high

      - name: Run E2E npm audit
        run: cd e2e && npm audit --audit-level=high

  # ============================================================================
  # Build Check
  # ============================================================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

  android-build:
    name: Android Debug APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            frontend/src-tauri/gen/android/**/*.gradle*
            frontend/src-tauri/gen/android/**/gradle-wrapper.properties

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0
            ndk;28.2.13676358

      - name: Export Android NDK path
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          key: ${{ runner.os }}-android-aarch64-1.93.1-${{ hashFiles('frontend/src-tauri/Cargo.lock', '.github/workflows/test.yml') }}-${{ env.RUST_CACHE_VERSION }}

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build secret-free Android debug APK
        run: cd frontend && npx tauri android build --debug --target aarch64 --apk --ci

      - name: Run Android native contract tests
        run: cd frontend/src-tauri/gen/android && bash ./gradlew --no-daemon testArm64DebugUnitTest

  # ============================================================================
  # Summary
  # ============================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [release-preflight, rust-tests, frontend-tests, system-e2e, lint, security, build, android-build]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Release Preflight | ${{ needs.release-preflight.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Tests | ${{ needs.rust-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.frontend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| System E2E | ${{ needs.system-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android Debug APK | ${{ needs.android-build.result }} |" >> $GITHUB_STEP_SUMMARY
